
    <head>
        <title>{{ page.title }} | {{ site.title }}</title>
        <meta name="description" content="{{ site.long-description }}">
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />


        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
        <meta name="msapplication-TileColor" content="#da532c">
        <meta name="theme-color" content="#ffffff">
        
  
  <!-- Facebook Meta Tags -->
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  {%- if page.excerpt -%}
  <meta property="og:description" content="{{ page.excerpt }}">
  {%- else -%}
  <meta property="og:description" content="{{ site.long-description }}">
  {%- endif -%}
  {%- if page.img -%}
  <meta property="og:image" content="https://mark.berthelemy.net/post-images/{{ page.img }}">
  {%- else -%}
  <meta property="og:image" content="https://mark.berthelemy.net/assets/img/page-images/mark-berthelemy-opengraph.png">
  {%- endif -%}

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:domain" content="{{ site.domain }}">
  <meta property="twitter:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:title" content="{{ page.title }} | {{ site.title }}">
  {%- if page.excerpt -%}
  <meta name="twitter:description" content="{{ page.excerpt }}">
  {%- else -%}
  <meta name="twitter:description" content="{{ site.long-description }}">
  {%- endif -%}
  {%- if page.img -%}
  <meta name="twitter:image" content="https://mark.berthelemy.net/post-images/{{ page.img }}">
  {%- else -%}
  <meta name="twitter:image" content="https://mark.berthelemy.net/assets/img/page-images/mark-berthelemy-opengraph.png">
  {%- endif -%}

        <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">

    
        <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/normalize.css">
        <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
        <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/overrides.css">
        <script src="https://kit.fontawesome.com/22cfb82c4b.js" crossorigin="anonymous"></script>
        <!--<link href="//maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet">-->
        <link href='https://fonts.googleapis.com/css?family=Vollkorn' rel='stylesheet' type='text/css'>
      
        <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

        <meta name="theme-color" content="#F1EED9">

    </head>
